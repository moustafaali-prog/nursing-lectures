<!DOCTYPE html><html lang="en" dir="ltr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nursing Lectures</title>
<meta name="description" content="Nursing lectures platform: Growth and Development and Pediatric Nursing.">
<link rel="stylesheet" href="assets/css/site.css">
<style>
body{background:radial-gradient(1200px 500px at 15% -10%, #e8f3ee, transparent 60%),radial-gradient(900px 420px at 85% 0%, #ecebfb, transparent 60%), var(--paper)}
.hub{display:grid;gap:16px;max-width:820px;margin:6vh auto 0}
.hub-card{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);
 border-radius:16px;padding:18px 20px;box-shadow:var(--shadow-2);transition:.2s}
.hub-card:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 18px 44px -22px var(--c)}
.hub-card .glyph{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;
 font-family:var(--serif);font-size:1.4rem;font-weight:700;color:#fff;background:var(--g)}
.hub-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.hub-title{font-family:var(--serif);font-size:1.18rem;font-weight:600}
.hub-desc{color:var(--muted);font-size:.86rem}
.hub-go{margin-inline-start:auto;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
 color:var(--c);border:1px solid var(--c);padding:.35rem .7rem;border-radius:999px;flex:none}
</style></head><body>
<main class="wrap">
  <div class="page-head" style="text-align:center;max-width:640px;margin-inline:auto">
    <div class="eyebrow">Nursing Lectures &middot; Level 26&ndash;27</div>
    <h1>Choose a course</h1>
    <p class="sub">Two independent platforms, one for each course.</p>
  </div>
  <div class="hub"><a class="hub-card" href="https://moustafaali-prog.github.io/growth-development-lectures/" style="--c:#0e6b57;--g:linear-gradient(135deg,#0e6b57 0%,#17a67e 100%)">
  <span class="glyph">G</span>
  <span class="hub-body">
    <span class="hub-title">Human Growth and Development</span>
    <span class="hub-desc">20 lectures &middot; 2 sections &middot; slides, full text and PPT/PDF downloads</span>
  </span>
  <span class="hub-go">Open</span>
</a><a class="hub-card" href="https://moustafaali-prog.github.io/pediatric-nursing-lectures/" style="--c:#4a4aa8;--g:linear-gradient(135deg,#4a4aa8 0%,#7b6ff0 100%)">
  <span class="glyph">P</span>
  <span class="hub-body">
    <span class="hub-title">Pediatric Nursing</span>
    <span class="hub-desc">12 lectures &middot; 1 section &middot; slides, full text and PPT/PDF downloads</span>
  </span>
  <span class="hub-go">Open</span>
</a></div>
</main>
<script src="assets/js/site.js"></script></body></html>
